name: AnimeStreaming
options:
  bundleIdPrefix: com.auax
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: L2DN68LPS5
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AnimeStreaming:
    type: application
    platform: macOS
    sources:
      - path: AnimeStreaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auax.AnimeStreaming
        CODE_SIGN_ENTITLEMENTS: AnimeStreaming/Resources/AnimeStreaming.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: AnimeStreaming/Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: AnimeStreaming
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "Copyright 2026"
        CFBundleURLTypes:
          - CFBundleURLName: com.auax.AnimeStreaming.auth
            CFBundleURLSchemes:
              - animestream
  AnimeStreamingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AnimeStreamingTests
    dependencies:
      - target: AnimeStreaming
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AnimeStreaming:
    build:
      targets:
        AnimeStreaming: all
        AnimeStreamingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AnimeStreamingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
