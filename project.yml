name: Nami
options:
  bundleIdPrefix: com.auax
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: L2DN68LPS5
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
targets:
  Nami:
    type: application
    platform: macOS
    sources:
      - path: Nami
    dependencies:
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auax.Nami
        CODE_SIGN_ENTITLEMENTS: Nami/Resources/Nami.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Nami/Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Nami
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "Copyright 2026"
        CFBundleURLTypes:
          - CFBundleURLName: com.auax.Nami.auth
            CFBundleURLSchemes:
              - nami
  NamiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NamiTests
    dependencies:
      - target: Nami
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nami:
    build:
      targets:
        Nami: all
        NamiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      language: en
      region: en
      targets:
        - NamiTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
